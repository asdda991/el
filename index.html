<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>بوابة النخبة | Elite Portal</title>
    <link rel="preconnect" href="https://images.fotmob.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.fotmob.com" />
    <style>
      html, body {
        background-color: #000000;
        color: #f4f4f5;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .initial-loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #000000;
        color: #f4f4f5;
        text-align: center;
        padding: 1rem;
        box-sizing: border-box;
      }
      .initial-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #27272a;
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 1.25rem;
      }
      .initial-title {
        font-size: 1.25rem;
        font-weight: 800;
        color: #ffffff;
        margin: 0 0 0.35rem 0;
        letter-spacing: -0.025em;
      }
      .initial-subtitle {
        font-size: 0.8rem;
        color: #a1a1aa;
        margin: 0;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader-container">
        <div class="initial-spinner"></div>
        <h1 class="initial-title">بوابة النخبة</h1>
        <p class="initial-subtitle">جاري تحميل الرياضة والسينما...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
